# Desktop (macOS) build.
#
# Builds the Electron shell in desktop/ into signed, notarized DMG and ZIP
# installers for Apple silicon and Intel. Runs on release tags of the form
# desktop-v* and on demand. Artifacts are uploaded to the workflow run; a
# maintainer attaches them (including latest-mac.yml and the .blockmap files,
# which power in-app updates) to a GitHub Release.
#
# Signing and notarization happen only when the secrets below are present.
# Without them the job still produces unsigned installers for internal
# testing; Gatekeeper will refuse to open those on other Macs.
#
# Secrets:
#   CSC_LINK             base64 of the Developer ID Application .p12
#   CSC_KEY_PASSWORD     its password
#   APPLE_API_KEY        App Store Connect API key (.p8 contents)
#   APPLE_API_KEY_ID     the key id
#   APPLE_API_ISSUER     the issuer id
name: Desktop (macOS)

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Desktop unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

  build:
    name: macOS installers
    needs: test
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci

      - name: Build DMG and ZIP (arm64 + x64)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Without a certificate, skip identity discovery instead of failing.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
        run: |
          if [ -n "$APPLE_API_KEY" ]; then
            # electron-builder reads the key from a file path.
            KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY" > "$KEY_PATH"
            export APPLE_API_KEY="$KEY_PATH"
          fi
          npm run dist:mac

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: accelerate-legal-macos
          if-no-files-found: error
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.blockmap
            desktop/release/latest-mac.yml
